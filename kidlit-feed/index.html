<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>#kidlitartpostcard – Bluesky Feed</title>

  <style>
    :root{
      --max-width:720px;
      --muted:#6b7280;
      --card-border: rgba(15,23,42,0.08);
      --radius:12px;
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
      color:#0f172a;
      background:#fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.35;
    }
    .wrap{
      max-width:var(--max-width);
      margin:20px auto;
      padding:18px;
    }
    .header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }
    .brand{display:flex;flex-direction:column;gap:6px;}
    .title{font-weight:800;font-size:18px;}
    .subtitle{color:var(--muted);font-size:13px;}
    .controls{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    select,button{
      padding:8px 12px;
      border-radius:10px;
      border:1px solid var(--card-border);
      background:#fff;
      font-size:14px;
      cursor:pointer;
    }
    button[disabled]{opacity:.6;cursor:default;}
    #status{font-size:13px;color:var(--muted);margin:8px 0;min-height:18px;}
    .error{color:#b91c1c;font-size:13px;margin:8px 0;display:none;}
    .post{
      border:1px solid var(--card-border);
      border-radius:var(--radius);
      padding:12px;
      margin-bottom:12px;
      background: linear-gradient(180deg, #fff, #fafafa);
    }
    .handle{font-weight:700;margin-bottom:6px;}
    .text{white-space:pre-wrap;margin-bottom:8px;font-size:15px;}
    .meta{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      color:var(--muted);
      font-size:12px;
      margin-top:10px;
    }
    .meta a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
    .gallery{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:8px;
    }
    .gallery img{
      width:180px;
      height:180px;
      object-fit:cover;
      border-radius:10px;
      border:1px solid rgba(0,0,0,0.05);
      background:#f8fafc;
    }
    footer{margin-top:18px;color:var(--muted);font-size:12px;}
    @media (max-width:520px){
      .gallery img{width:130px;height:130px;}
      .header{flex-direction:column;align-items:stretch;}
      .controls{justify-content:flex-start;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <div class="title">#kidlitartpostcard</div>
        <div class="subtitle">Feed pulled from Bluesky via your Netlify hashtag function. Images use public CDN URLs (no blob proxy needed).</div>
      </div>

      <div class="controls">
        <label for="sort" style="font-size:13px;color:var(--muted);">Sort</label>
        <select id="sort" aria-label="Sort posts">
          <option value="top" selected>Most popular</option>
          <option value="latest">Latest</option>
        </select>
        <button id="loadMore" type="button">Load more</button>
      </div>
    </div>

    <div id="status"></div>
    <div id="error" class="error"></div>
    <div id="posts" aria-live="polite"></div>

    <footer>
      If you see broken images, open one post JSON and confirm it includes <code>embed.images[].fullsize</code> or <code>thumb</code> URLs.
    </footer>
  </div>

        if(!msg){ errorEl.style.display="none"; errorEl.textContent=""; return; }

      }

        return String(s || "")

          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'", "&#039;");

        const m = String(uri||"").match(/^at:\/\/([^/]+)\//);
        return m ? m[1] : null;

        const did = didFromUri(uri);
        const rkey = String(uri||"").split("/").pop();
        if(!did || !rkey) return null;
        return `https://bsky.app/profile/${did}/post/${rkey}`;
      }

        const out = [];
        const imgs = p?.embed?.images;
        if(Array.isArray(imgs)){
          for(const im of imgs){
            const src = im.fullsize || im.thumb;
            if(src) out.push({ src, alt: im.alt || "" });
          }
        }
        return out;
      }

        if(!res.ok){
          try {
            const j = JSON.parse(text);

          } catch {
            throw new Error(`Request failed: ${res.status}`);
          }
        }
        try { return JSON.parse(text); }
        catch { throw new Error("Bad JSON from hashtag function"); }
      }
